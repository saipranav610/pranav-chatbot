<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pranav's chat bot</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        #chat-box { height: 400px; border: 1px solid #ccc; border-radius: 8px; overflow-y: auto; padding: 15px; margin-bottom: 15px; background: #f9f9f9; }
        .message { margin-bottom: 15px; line-height: 1.4; }
        .user { color: #0056b3; text-align: right; }
        .bot { color: #333; text-align: left; }
        .input-area { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #004494; }
    </style>
</head>
<body>
    <h2>🤖 Pranav's chat bot</h2>
    <div id="chat-box"></div>
    
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type a message..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        
        // The system prompt now tells the AI its specific identity
        let messageHistory = [
            { role: "system", content: "You are the AI assistant for Pranav's chat bot. Be helpful, concise, and polite." }
        ];

        function handleEnter(event) {
            if (event.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            messageHistory.push({ role: "user", content: text });
            chatBox.innerHTML += `<div class="message user"><strong>You:</strong> ${text}</div>`;
            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('http://localhost:3000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messageHistory })
                });

                const data = await response.json();
                const botReply = data.reply;

                messageHistory.push(botReply);
                chatBox.innerHTML += `<div class="message bot"><strong>Pranav's Bot:</strong> ${botReply.content}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += `<div class="message bot" style="color: red;">Error connecting to server.</div>`;
            }
        }
    </script>
</body>
</html>
